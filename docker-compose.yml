name: jp-orchestrator

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o README)}
      POSTGRES_DB: orchestrator
    # Host loopback only (for running the API outside Docker). The api service uses the compose network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Over TCP with the password, so a wrong POSTGRES_PASSWORD fails the healthcheck instead of passing on the socket.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U jp -d orchestrator -tAc 'select 1' | grep -q 1"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (veja o README)}
    # The shell expands the password from the env at start: the compose file and the image Cmd hold no value.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      PORT: 3001
      # Use URL-safe passwords (hex from openssl rand -hex): they are interpolated into the URLs.
      DATABASE_URL: postgres://jp:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o README)}@postgres:5432/orchestrator
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (veja o README)}@redis:6379
      WEBHOOK_URL: http://api:3001/webhooks/inbox
      # The image runs with NODE_ENV=production: the API refuses to boot without API keys or with the
      # public default secret. Generate them once into .env (see README, "Como rodar").
      API_KEYS: ${API_KEYS:?defina API_KEYS no .env (veja o README)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env (veja o README)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-700}
      MAX_PARALLEL: 4
    # Published on the host loopback only.
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # readiness: 503 while Postgres or Redis is unreachable
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 3s
      retries: 30

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # baked into the browser bundle: the dashboard's own key (see README)
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:?defina NEXT_PUBLIC_API_KEY no .env (veja o README)}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
