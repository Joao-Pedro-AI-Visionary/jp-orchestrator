name: jp-orchestrator

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: jp
      POSTGRES_DB: orchestrator
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jp -d orchestrator"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://jp:jp@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379
      WEBHOOK_URL: http://api:3001/webhooks/inbox
      # The image runs with NODE_ENV=production: the API refuses to boot without API keys or with the
      # public default secret. Generate them once into .env (see README, "Como rodar").
      API_KEYS: ${API_KEYS:?defina API_KEYS no .env (veja o README)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env (veja o README)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-700}
      MAX_PARALLEL: 4
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # readiness: 503 while Postgres or Redis is unreachable
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 3s
      retries: 30

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # baked into the browser bundle: the dashboard's own key (see README)
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:?defina NEXT_PUBLIC_API_KEY no .env (veja o README)}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
